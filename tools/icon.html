<!doctype html>
<!-- Rasterises favicon.svg at 180x180 for apple-touch-icon.png and favicon.ico,
     which cannot be SVG.

       chrome --headless=new --window-size=180,180
              --screenshot=apple-touch-icon.png tools/icon.html

     then, for the .ico, downsample that PNG to 16, 32 and 48 px in one file:

       python -c "from PIL import Image; im=Image.open('apple-touch-icon.png'); \
         im.resize((48,48), Image.LANCZOS).save('favicon.ico', \
         sizes=[(16,16),(32,32),(48,48)])"

     Check the 16px rendering before shipping it -- that is the size it is
     actually seen at, and detail that survives at 180 disappears there. --><html><head><meta charset="utf-8">
<style>html,body{margin:0;width:180px;height:180px;overflow:hidden;background:#0a0a0c}
img{width:180px;height:180px;display:block}</style></head>
<body><img src="../favicon.svg" alt=""></body></html>
