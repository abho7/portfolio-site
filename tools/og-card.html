<!doctype html>
<!-- Source for og.png, the link-preview card.

     Render it at twice the target size and downsample to 1200x630 (Lanczos):

       chrome --headless=new --window-size=1200,630
              --force-device-scale-factor=2 --screenshot=og2x.png
              tools/og-card.html

     Rendering straight at 1x leaves the serif noticeably softer at the size
     LinkedIn shows it, which is why the shipped file is supersampled.

     The card pulls the real stylesheet, so it uses the same faces, palette
     and gradient as the page it advertises and cannot drift from them. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  body{
    background:var(--page); color:var(--ink);
    display:flex; flex-direction:column; justify-content:center;
    padding:0 84px; box-sizing:border-box; position:relative;
  }
  /* The same faint field the site sits on, drawn statically since the card
     cannot run the canvas. */
  .grid{position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(to right,  var(--line) 0 1px, transparent 1px 76px),
      repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 76px);
    opacity:.55;}
  .glow{position:absolute; right:-160px; bottom:-220px; width:720px; height:720px;
    background:radial-gradient(circle, rgba(var(--accent-rgb),.16) 0%, transparent 62%);}
  .in{position:relative}
  .eyebrow{font-family:var(--mono); font-size:19px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--label); margin:0 0 26px}
  .name{font-family:var(--serif); font-weight:400; font-size:82px; line-height:1;
    letter-spacing:-.01em; margin:0 0 22px}
  .thesis{font-family:var(--serif); font-weight:400; font-size:50px; line-height:1.1;
    margin:0 0 34px}
  .rule{height:1px; background:var(--line-2); margin:0 0 26px; width:620px}
  .foot{font-family:var(--mono); font-size:20px; color:var(--label); margin:0;
    letter-spacing:.02em}
  .foot b{color:var(--ink-2); font-weight:400}
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="in">
    <p class="eyebrow">Personal portfolio &middot; Frisco, TX</p>
    <h1 class="name">Abhineeth Duddela</h1>
    <p class="thesis">Distributed systems, <span class="ital">proven under fire.</span></p>
    <div class="rule"></div>
    <p class="foot">Raft &middot; HNSW &middot; WebGPU &middot; Compilers &nbsp;&nbsp;<b>abho7.github.io/portfolio-site</b></p>
  </div>
</body></html>
